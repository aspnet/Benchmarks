# Remote Crank scenario: sourceRevision selects an aspnet/Benchmarks source.
# Append the unchanged ../steadystate.profile.yml once as the FINAL --config.
imports:
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Bombardier/bombardier.yml

variables:
  sourceRevision: "main"
  serverAddress: ""
  serverPort: 8080
  cpu: 1
  memoryBytes: 536870912
  rate: 100
  warmup: 5
  duration: 15
  connections: 8
  timeout: 2

jobs:
  todo-csharp:
    sources:
      app:
        localFolder: null
        repository: https://github.com/aspnet/Benchmarks.git
        branchOrCommit: "#{{sourceRevision}}"
        destinationFolder: app
        cacheOnAgent: false
    dockerFile: app/src/BenchmarksApps/MinimalTodo/csharp/Dockerfile
    dockerContextDirectory: app/src/BenchmarksApps/MinimalTodo/csharp
    dockerImageName: "minimal-todo-csharp-{{job.RunId}}"
    readyStateText: Application started.
    environmentVariables:
      PORT: "{{serverPort}}"
    onConfigure:
      - |
        job.Sources["app"].LocalFolder = null;
        const sourceRevision = String(job.Variables["sourceRevision"]);
        if (sourceRevision == "main")
          job.Sources["app"].BranchOrCommit = "main";
        else if (/^[0-9a-f]{40}$/.test(sourceRevision))
          job.Sources["app"].BranchOrCommit = "#" + sourceRevision;
        else
          throw new Error('sourceRevision must be "main" or an explicit repository commit');
        job.CpuLimitRatio = Number(job.Variables["cpu"]);
        job.MemoryLimitInBytes = Number(job.Variables["memoryBytes"]);
        job.Port = Number(job.Variables["serverPort"]);
        if (!Number.isFinite(job.CpuLimitRatio) || job.CpuLimitRatio <= 0 ||
            !Number.isSafeInteger(Number(job.Variables["memoryBytes"])) || job.MemoryLimitInBytes <= 0 ||
            !Number.isInteger(Number(job.Variables["serverPort"])) || job.Port < 1 || job.Port > 65535)
          throw new Error("Invalid CPU quota, memory bytes or server port");
    options:
      requiredOperatingSystem: linux

  todo-go:
    sources:
      app:
        localFolder: null
        repository: https://github.com/aspnet/Benchmarks.git
        branchOrCommit: "#{{sourceRevision}}"
        destinationFolder: app
        cacheOnAgent: false
    dockerFile: app/src/BenchmarksApps/MinimalTodo/go/Dockerfile
    dockerContextDirectory: app/src/BenchmarksApps/MinimalTodo/go
    dockerImageName: "minimal-todo-go-{{job.RunId}}"
    readyStateText: Application started.
    environmentVariables:
      PORT: "{{serverPort}}"
    onConfigure:
      - |
        job.Sources["app"].LocalFolder = null;
        const sourceRevision = String(job.Variables["sourceRevision"]);
        if (sourceRevision == "main")
          job.Sources["app"].BranchOrCommit = "main";
        else if (/^[0-9a-f]{40}$/.test(sourceRevision))
          job.Sources["app"].BranchOrCommit = "#" + sourceRevision;
        else
          throw new Error('sourceRevision must be "main" or an explicit repository commit');
        job.CpuLimitRatio = Number(job.Variables["cpu"]);
        job.MemoryLimitInBytes = Number(job.Variables["memoryBytes"]);
        job.Port = Number(job.Variables["serverPort"]);
        if (!Number.isFinite(job.CpuLimitRatio) || job.CpuLimitRatio <= 0 ||
            !Number.isSafeInteger(Number(job.Variables["memoryBytes"])) || job.MemoryLimitInBytes <= 0 ||
            !Number.isInteger(Number(job.Variables["serverPort"])) || job.Port < 1 || job.Port > 65535)
          throw new Error("Invalid CPU quota, memory bytes or server port");
    options:
      requiredOperatingSystem: linux

  todo-rust:
    sources:
      app:
        localFolder: null
        repository: https://github.com/aspnet/Benchmarks.git
        branchOrCommit: "#{{sourceRevision}}"
        destinationFolder: app
        cacheOnAgent: false
    dockerFile: app/src/BenchmarksApps/MinimalTodo/rust/Dockerfile
    dockerContextDirectory: app/src/BenchmarksApps/MinimalTodo/rust
    dockerImageName: "minimal-todo-rust-{{job.RunId}}"
    readyStateText: Application started.
    environmentVariables:
      PORT: "{{serverPort}}"
    onConfigure:
      - |
        job.Sources["app"].LocalFolder = null;
        const sourceRevision = String(job.Variables["sourceRevision"]);
        if (sourceRevision == "main")
          job.Sources["app"].BranchOrCommit = "main";
        else if (/^[0-9a-f]{40}$/.test(sourceRevision))
          job.Sources["app"].BranchOrCommit = "#" + sourceRevision;
        else
          throw new Error('sourceRevision must be "main" or an explicit repository commit');
        job.CpuLimitRatio = Number(job.Variables["cpu"]);
        job.MemoryLimitInBytes = Number(job.Variables["memoryBytes"]);
        job.Port = Number(job.Variables["serverPort"]);
        if (!Number.isFinite(job.CpuLimitRatio) || job.CpuLimitRatio <= 0 ||
            !Number.isSafeInteger(Number(job.Variables["memoryBytes"])) || job.MemoryLimitInBytes <= 0 ||
            !Number.isInteger(Number(job.Variables["serverPort"])) || job.Port < 1 || job.Port > 65535)
          throw new Error("Invalid CPU quota, memory bytes or server port");
    options:
      requiredOperatingSystem: linux

scenarios:
  csharp:
    application: {job: todo-csharp}
    load:
      job: bombardier
      variables:
        path: /todos
        transport: http1
        presetHeaders: none
        customHeaders:
          - "Accept: application/json"
          - "Connection: keep-alive"
          - "Accept-Encoding: identity"
  go:
    application: {job: todo-go}
    load:
      job: bombardier
      variables:
        path: /todos
        transport: http1
        presetHeaders: none
        customHeaders:
          - "Accept: application/json"
          - "Connection: keep-alive"
          - "Accept-Encoding: identity"
  rust:
    application: {job: todo-rust}
    load:
      job: bombardier
      variables:
        path: /todos
        transport: http1
        presetHeaders: none
        customHeaders:
          - "Accept: application/json"
          - "Connection: keep-alive"
          - "Accept-Encoding: identity"

results:
  # bombardier/raw is the raw per-request Bombardier JSON payload; excluded
  # here only to avoid persisting that large aggregate -- standard Bombardier
  # scalars (requests, bad responses, latencies, RPS, throughput) and the
  # shared steadystate.profile.yml CPU/working-set P90 helpers already cover
  # day-to-day reporting.
  - {name: bombardier/raw, excluded: true}
