# Examples:
# --config json.benchmarks.yml --scenario json --profile aspnet-gold-lin

imports:
  - https://raw.githubusercontent.com/aspnet/Benchmarks/main/scenarios/aspnet.profiles.yml
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Wrk/wrk.yml

jobs:
  aspnetbenchmarks:
    source:
      repository: https://github.com/aspnet/benchmarks.git
      branchOrCommit: main
      project: src/Benchmarks/Benchmarks.csproj
    readyStateText: Application started.
    variables:
      presetHeaders: json
      protocol: http
      serverScheme: http
      serverPort: 5000
      server: Kestrel
      transport: Sockets
      scenario: plaintext
      database: ''
    arguments: "--nonInteractive true --scenarios {{scenario}} --urls {{serverScheme}}://{{serverAddress}}:{{serverPort}} --server {{server}} --kestrelTransport {{transport}} --protocol {{protocol}} {% if database.size > 0 %} --database {{ database }} {% endif %}"
  
scenarios:

  json:
    application:
      job: aspnetbenchmarks
      variables:
        scenario: json
    load:
      job: wrk
      variables:
        path: /json

  https:
    application:
      job: aspnetbenchmarks
      variables:
        scenario: json
        serverScheme: https
        protocol: https
    load:
      job: wrk
      variables:
        path: /json
        serverScheme: https

  mvc:
    application:
      job: aspnetbenchmarks
      variables:
        scenario: jsonmvc
    load:
      job: wrk
      variables:
        path: /mvc/json
